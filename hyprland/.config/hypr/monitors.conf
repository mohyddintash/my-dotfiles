# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions: hyprctl monitors
# Format: monitor = [port], resolution@refresh, position, scale

# Laptop (LG Display, ~15") - scale 1.25 for comfortable text (logical 1536x864)
monitor=eDP-1,1920x1080@60,0x0,1.5

# Acer CB342CK 34" ultrawide - smooth 60fps, full ultrawide width (logical 2560x1080)
monitor=HDMI-A-1,2560x1080@60,auto-left,1.25
#monitor=HDMI-A-1,2560x1080@60,auto-left,1

# Pin workspaces to monitors so switching workspaces never "steals" a
# workspace from the other screen. Ultrawide is the main monitor, so it
# gets more workspaces (1-6); laptop gets the rest (7-0).
# bin/.local/bin/dev-setup's APPS array depends on this exact split — if
# monitor names or the pinning change, update both together (see
# bin/.local/bin/AGENTS.md).
workspace = 1, monitor:HDMI-A-1, default:true, persistent:true
workspace = 2, monitor:HDMI-A-1, persistent:true
workspace = 3, monitor:HDMI-A-1, persistent:true
workspace = 4, monitor:HDMI-A-1, persistent:true
workspace = 5, monitor:HDMI-A-1, persistent:true
workspace = 6, monitor:HDMI-A-1, persistent:true
workspace = 7, monitor:eDP-1, default:true, persistent:true
workspace = 8, monitor:eDP-1, persistent:true
workspace = 9, monitor:eDP-1, persistent:true
workspace = 10, monitor:eDP-1, persistent:true
