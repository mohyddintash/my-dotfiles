# herdr-session spec: the terminals of profiles/last-session.yml (snapshot of
# 2026-11-04), as Herdr spaces and tabs instead of separate windows.
# Read by ~/.local/bin/herdr-session; see bin/.local/bin/AGENTS.md.
#
# spaces[]: one per project.
#   name    Herdr space name; also how herdr-session recognises it on re-runs
#   folder  where its terminals start (`~` is expanded)
#   tabs[]:
#     name   tab name; also how herdr-session recognises it on re-runs
#     run    optional command for the tab's first terminal. A `claude ...`
#            run is re-sent if the chat isn't running any more (after a reboot)
#     panes  optional, default 1; extra panes are plain shells split to the right
#
# Browsers, Bitwarden and the learning guide are in profiles/herdr.yml.

spaces:
  - name: scholar-site
    folder: /home/mo/dev/scholar-site-workspace/scholar-site
    tabs:
      - name: About page UI
        run: claude --resume 2adbc18d-30f4-4ca2-800b-bba4fd5d76da
      - name: shell
        panes: 2
      - name: docker
        run: sudo docker compose up
        panes: 2

  - name: assim-haitham
    folder: /home/mo/dev/scholar-site-workspace/clients/assim-haitham
    tabs:
      - name: README-CLIENT steps
        run: claude --resume acd7012b-3af0-46d7-a299-83759b2671c7

